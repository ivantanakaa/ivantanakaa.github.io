baseURL = "https://ivantanaka.github.io/"
languageCode = "en-us"
title = "Tanaka's Table"
theme = "PaperMod"

[params]
  author = "Tanaka"
  description = "A gourmet that make a smile"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowShareButtons = false
  ShowToc = false
  defaultTheme = "light"
  disableThemeToggle = true

  # Cover image settings — shows hero image on post cards
  cover.linkFullImages = true
  cover.responsiveImages = true

[params.homeInfoParams]
  Title = "🍽️ Tanaka's Table"
  Content = "A gourmet that make a smile. Find your next favorite meal."

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/ivantanaka"

[taxonomies]
  tag = "tags"
  location = "locations"

[permalinks]
  [permalinks.page]
    posts = "/posts/:year/:month/:slug/"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "locations"
    name = "📍 By Location"
    url = "/locations/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]
